<!DOCTYPE html>
<html lang="en">
<head>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="initial-scale=1, width=device-width">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.9.179/pdf.min.js"></script>
<link rel="icon" href="{{ url_for('static', filename='icon.ico') }}" type="image/x-icon">
<link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple.png') }}">
<link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='and.png') }}">
  <title>Union Contract Assistant</title>
  <style>
    body {
      background-color: #1e1e1e;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      padding: 2em;
    }
    input[type="text"] {
      width: 60%;
      padding: 10px;
      border: none;
      border-radius: 5px;
    }
    input[type="submit"] {
      padding: 10px 15px;
      background-color: #2e8b57;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .answer {
      margin-top: 1.5em;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <h1>Ask About Your Union Contract</h1>
  <form id="qa-form">
    <input type="text" id="question" placeholder="Type your question..." required>
    <input type="submit" value="Ask">
  </form>
  <div class="answer" id="answer"></div>
<div id="pdf-viewer" style="width: 100%; height: 800px; overflow: auto; border: 1px solid #ccc;"></div>
  <script>
    document.getElementById('qa-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const question = document.getElementById('question').value;
      const res = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question })
      });
      const data = await res.json();
      document.getElementById('answer').innerText = data.answer || data.error || "Error occurred.";
    });
    const url = '/contract';  // your Flask route serving the PDF

// Load the PDF
const loadingTask = pdfjsLib.getDocument(url);
loadingTask.promise.then(pdf => {
    const viewer = document.getElementById('pdf-viewer');

    for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
        pdf.getPage(pageNumber).then(page => {
            const canvas = document.createElement('canvas');
            viewer.appendChild(canvas);
            const context = canvas.getContext('2d');
            const viewport = page.getViewport({ scale: 1.2 }); // zoom
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            page.render({ canvasContext: context, viewport: viewport });
        });
    }
});
  </script>
</body>
</html>
